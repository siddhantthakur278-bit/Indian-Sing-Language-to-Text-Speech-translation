<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#141C2E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8F6E18" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D6D" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Outer Glowing Gold Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="16 8" opacity="0.6" />

  <!-- Inner Ruby Shield Circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#rubyGrad)" stroke-width="3" filter="url(#glow)" opacity="0.8" />

  <!-- Central Hand Gesture Silhouette -->
  <path d="M210 330 C200 330 190 320 190 300 L190 200 C190 188 200 178 212 178 C224 178 234 188 234 200 L234 270 M234 220 L234 160 C234 148 244 138 256 138 C268 138 278 148 278 160 L278 270 M278 220 L278 170 C278 158 288 148 300 148 C312 148 322 158 322 170 L322 280 M322 240 L322 200 C322 188 332 178 344 178 C356 178 366 188 366 200 L366 310 C366 350 330 380 290 380 L250 380 C220 380 210 350 210 330 Z"
        fill="url(#goldGrad)"
        filter="url(#glow)" />

  <!-- Sparkle Accent Stars -->
  <polygon points="380,120 385,135 400,140 385,145 380,160 375,145 360,140 375,135" fill="#FFDF00" />
  <polygon points="120,360 123,370 133,373 123,376 120,386 117,376 107,373 117,370" fill="#E63946" />
</svg>
