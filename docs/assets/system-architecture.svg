<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="100%" stop-color="#14213d"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0fa3b1" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f77f00" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bg)" rx="16"/>
  <rect x="2" y="2" width="1096" height="676" fill="none" stroke="#1f2f54" stroke-width="2" rx="15"/>

  <!-- Title & Legend Header -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">
      System Pipeline Architecture &amp; Module Ownership
    </text>
    <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="13">
      Independent decoupled modules communicating via fixed integration contracts
    </text>

    <!-- Legend -->
    <g transform="translate(620, -10)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#0fa3b1"/>
      <text x="22" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Siddhant (Frontend)</text>

      <rect x="170" y="0" width="14" height="14" rx="3" fill="#2a9d8f"/>
      <text x="192" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Parth (ML / Vision)</text>

      <rect x="330" y="0" width="14" height="14" rx="3" fill="#f77f00"/>
      <text x="352" y="12" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="600">Abhi (NLP / Backend)</text>
    </g>
  </g>

  <!-- Row 1: Vision & ML Pipeline (Left to Right) -->
  <!-- 1. Camera -->
  <g transform="translate(50, 130)" filter="url(#cardShadow)">
    <rect width="190" height="100" rx="12" fill="#14213d" stroke="#0fa3b1" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="6" fill="#0fa3b1" rx="3"/>
    <text x="95" y="38" fill="#48cae4" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">1. Camera Input</text>
    <text x="95" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Laptop Webcam / Phone</text>
    <text x="95" y="78" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">640x480 @ 30 FPS</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 240 180 L 290 180" stroke="#0fa3b1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 2. Landmarks -->
  <g transform="translate(300, 130)" filter="url(#cardShadow)">
    <rect width="210" height="100" rx="12" fill="#14213d" stroke="#0fa3b1" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="6" fill="#0fa3b1" rx="3"/>
    <text x="105" y="38" fill="#48cae4" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">2. MediaPipe Holistic</text>
    <text x="105" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Pose (33) + Hands (21x2)</text>
    <text x="105" y="78" fill="#f77f00" font-family="monospace" font-size="10" text-anchor="middle">258 floats / frame</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 510 180 L 560 180" stroke="#0fa3b1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 3. Preprocessing -->
  <g transform="translate(570, 130)" filter="url(#cardShadow)">
    <rect width="220" height="100" rx="12" fill="#14213d" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="6" fill="#2a9d8f" rx="3"/>
    <text x="110" y="38" fill="#2ec4b6" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">3. Preprocessing</text>
    <text x="110" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Mid-Shoulder Centroid Shift</text>
    <text x="110" y="78" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Shoulder Scale + 30-Frame Buffer</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 790 180 L 840 180" stroke="#0fa3b1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- 4. Sign Model -->
  <g transform="translate(850, 130)" filter="url(#cardShadow)">
    <rect width="200" height="100" rx="12" fill="#14213d" stroke="#2a9d8f" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" fill="#2a9d8f" rx="3"/>
    <text x="100" y="38" fill="#2ec4b6" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">4. BiLSTM Model</text>
    <text x="100" y="60" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">TensorFlow.js / Web Worker</text>
    <text x="100" y="78" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Softmax over 70 classes + IDLE</text>
  </g>

  <!-- Connecting down from Model to Smoothing -->
  <path d="M 950 230 L 950 290" stroke="#0fa3b1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Row 2: Smoothing & Language Pipeline (Right to Left) -->
  <!-- 5. Smoothing & State Machine -->
  <g transform="translate(830, 300)" filter="url(#cardShadow)">
    <rect width="220" height="105" rx="12" fill="#14213d" stroke="#0fa3b1" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="6" fill="#0fa3b1" rx="3"/>
    <text x="110" y="36" fill="#48cae4" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">5. Temporal Smoothing</text>
    <text x="110" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Confidence &gt; 0.8 &amp; 4/5 Voting</text>
    <text x="110" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">30-Frame Cooldown (~1s)</text>
    <text x="110" y="94" fill="#f77f00" font-family="sans-serif" font-size="10" text-anchor="middle">1.5s Pause → End of Sentence</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 830 352 L 780 352" stroke="#f77f00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 6. Gloss to Sentence -->
  <g transform="translate(560, 300)" filter="url(#cardShadow)">
    <rect width="210" height="105" rx="12" fill="#14213d" stroke="#f77f00" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="6" fill="#f77f00" rx="3"/>
    <text x="105" y="36" fill="#fcbf49" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">6. Gloss → Sentence</text>
    <text x="105" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Rule Engine + SOV LLM</text>
    <text x="105" y="76" fill="#d62839" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Fixed Safety Emergency Bypass</text>
    <text x="105" y="94" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">POST /api/sentence</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 560 352 L 500 352" stroke="#f77f00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 7. Multilingual Translation -->
  <g transform="translate(290, 300)" filter="url(#cardShadow)">
    <rect width="200" height="105" rx="12" fill="#14213d" stroke="#f77f00" stroke-width="2"/>
    <rect x="0" y="0" width="200" height="6" fill="#f77f00" rx="3"/>
    <text x="100" y="36" fill="#fcbf49" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">7. Indic Translation</text>
    <text x="100" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">IndicTrans2 / Bhashini</text>
    <text x="100" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Hindi, Marathi, Tamil, etc.</text>
    <text x="100" y="94" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">LRU Cached Responses</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 290 352 L 230 352" stroke="#f77f00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>

  <!-- 8. Speech Output -->
  <g transform="translate(50, 300)" filter="url(#cardShadow)">
    <rect width="170" height="105" rx="12" fill="#14213d" stroke="#f77f00" stroke-width="2"/>
    <rect x="0" y="0" width="170" height="6" fill="#f77f00" rx="3"/>
    <text x="85" y="36" fill="#fcbf49" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">8. Voice Synthesis</text>
    <text x="85" y="58" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Web Speech API</text>
    <text x="85" y="76" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Bhashini Cloud TTS</text>
    <text x="85" y="94" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Zero-Cost Browser Audio</text>
  </g>

  <!-- Arrow down to Web UI -->
  <path d="M 135 405 L 135 480" stroke="#0fa3b1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 390 405 L 390 480" stroke="#0fa3b1" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Row 3: Web App Layer -->
  <g transform="translate(50, 490)" filter="url(#cardShadow)">
    <rect width="1000" height="135" rx="14" fill="#0f172a" stroke="#0fa3b1" stroke-width="2"/>
    <rect x="0" y="0" width="1000" height="6" fill="#0fa3b1" rx="3"/>

    <text x="500" y="36" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">
      9. Web Application Studio (Next.js 14 • React • Tailwind CSS • PWA)
    </text>

    <!-- Sub-components in UI -->
    <g transform="translate(40, 55)">
      <rect x="0" y="0" width="165" height="55" rx="8" fill="#1e293b"/>
      <text x="82" y="24" fill="#48cae4" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CameraView</text>
      <text x="82" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Skeleton Overlay &amp; FPS</text>

      <rect x="185" y="0" width="175" height="55" rx="8" fill="#1e293b"/>
      <text x="272" y="24" fill="#48cae4" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">CaptionPanel</text>
      <text x="272" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Glosses &amp; 24px+ Text</text>

      <rect x="380" y="0" width="165" height="55" rx="8" fill="#1e293b"/>
      <text x="462" y="24" fill="#48cae4" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">LanguageSelect</text>
      <text x="462" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">10+ Indic Languages</text>

      <rect x="565" y="0" width="165" height="55" rx="8" fill="#1e293b"/>
      <text x="647" y="24" fill="#d62839" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">EmergencyBar</text>
      <text x="647" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Verified Panic Phrases</text>

      <rect x="750" y="0" width="170" height="55" rx="8" fill="#1e293b"/>
      <text x="835" y="24" fill="#48cae4" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Settings &amp; PWA</text>
      <text x="835" y="42" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">WCAG AA &amp; Offline Cache</text>
    </g>
  </g>
</svg>
