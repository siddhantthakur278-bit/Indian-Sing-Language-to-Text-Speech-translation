<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="slicePose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sliceLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sliceRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="fShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="520" rx="16" fill="#0b1324"/>
  <rect x="2" y="2" width="996" height="516" rx="15" fill="none" stroke="#1f2f54" stroke-width="2"/>

  <!-- Title -->
  <g transform="translate(50, 40)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800">
      Integration Contract 7.1: 258-Dimensional Landmark Vector
    </text>
    <text x="0" y="24" fill="#94a3b8" font-family="sans-serif" font-size="13">
      Exact spatial representation shared synchronously between Python training (extract_keypoints.py) and Browser TypeScript (landmarks.ts)
    </text>
  </g>

  <!-- Vector Layout Ribbon (Total 258 Floats) -->
  <g transform="translate(50, 110)">
    <!-- Header -->
    <text x="0" y="-12" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="700">
      PER-FRAME FEATURE VECTOR CONCATENATION [0 : 258]
    </text>

    <!-- Slice 1: Pose (132 floats) - Width = 460px -->
    <rect x="0" y="0" width="460" height="54" rx="8" fill="url(#slicePose)" filter="url(#fShadow)"/>
    <text x="230" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      POSE LANDMARKS: 33 × 4 [x, y, z, visibility]
    </text>
    <text x="230" y="44" fill="#e0f2fe" font-family="monospace" font-size="11" text-anchor="middle">
      Indices: [0 : 132] (132 Floats)
    </text>

    <!-- Slice 2: Left Hand (63 floats) - Width = 215px -->
    <rect x="470" y="0" width="210" height="54" rx="8" fill="url(#sliceLeft)" filter="url(#fShadow)"/>
    <text x="575" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      LEFT HAND: 21 × 3 [x, y, z]
    </text>
    <text x="575" y="44" fill="#d1fae5" font-family="monospace" font-size="11" text-anchor="middle">
      Indices: [132 : 195] (63 Floats)
    </text>

    <!-- Slice 3: Right Hand (63 floats) - Width = 215px -->
    <rect x="690" y="0" width="210" height="54" rx="8" fill="url(#sliceRight)" filter="url(#fShadow)"/>
    <text x="795" y="25" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      RIGHT HAND: 21 × 3 [x, y, z]
    </text>
    <text x="795" y="44" fill="#fef3c7" font-family="monospace" font-size="11" text-anchor="middle">
      Indices: [195 : 258] (63 Floats)
    </text>
  </g>

  <!-- Mathematical Normalization Box -->
  <g transform="translate(50, 210)">
    <rect width="900" height="150" rx="12" fill="#14213d" stroke="#334155" stroke-width="1.5"/>

    <text x="25" y="32" fill="#0fa3b1" font-family="sans-serif" font-size="14" font-weight="700">
      📐 Invariant Normalization Mathematical Specification
    </text>

    <!-- Formula 1: Centroid -->
    <g transform="translate(25, 55)">
      <rect width="390" height="72" rx="8" fill="#0b1324" stroke="#1f2f54" stroke-width="1"/>
      <text x="18" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">
        1. Centroid Origin (Mid-Shoulder Reference):
      </text>
      <text x="18" y="52" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">
        Center = (P[11] + P[12]) / 2.0
      </text>
    </g>

    <!-- Formula 2: Scale -->
    <g transform="translate(445, 55)">
      <rect width="430" height="72" rx="8" fill="#0b1324" stroke="#1f2f54" stroke-width="1"/>
      <text x="18" y="26" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">
        2. Invariant Euclidean Scale (Shoulder Width):
      </text>
      <text x="18" y="52" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="700">
        Scale = ||P[11] - P[12]||₂ + 1e-6
      </text>
    </g>
  </g>

  <!-- Contract Rules Footer Table -->
  <g transform="translate(50, 385)">
    <rect width="900" height="95" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">
      Key Implementation Constraints (Python &amp; TypeScript Parity):
    </text>
    <text x="25" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      • <tspan fill="#34d399">Hand Missing:</tspan> Unseen hands remain filled with 0.0 (masked in BiLSTM layer).
    </text>
    <text x="25" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      • <tspan fill="#34d399">Visibility Floats:</tspan> Pose visibility [idx+3] is kept unmodified; only (x, y, z) undergo center shift and scaling.
    </text>
    <text x="480" y="52" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      • <tspan fill="#34d399">Sequence Shape:</tspan> Exactly 30 frames via linspace temporal resampling.
    </text>
    <text x="480" y="72" fill="#cbd5e1" font-family="sans-serif" font-size="11">
      • <tspan fill="#34d399">Unit Test Parity:</tspan> Verified with <tspan font-family="monospace">ml/sample_io.npz</tspan> (tolerance &lt; 1e-4).
    </text>
  </g>
</svg>
