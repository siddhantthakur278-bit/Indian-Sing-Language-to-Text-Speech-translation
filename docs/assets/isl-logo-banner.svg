<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="50%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0fa3b1"/>
      <stop offset="100%" stop-color="#48cae4"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f77f00"/>
      <stop offset="100%" stop-color="#fcbf49"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>
  <rect x="2" y="2" width="1196" height="416" fill="none" stroke="#1f2f54" stroke-width="2" rx="15"/>

  <!-- Indian Tricolor Top Ribbon Accent -->
  <rect x="0" y="0" width="1200" height="6" fill="#FF9933"/>
  <rect x="0" y="6" width="1200" height="4" fill="#FFFFFF"/>
  <rect x="0" y="10" width="1200" height="6" fill="#138808"/>

  <!-- Subtle Background Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1000" y1="0" x2="1000" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
  </g>

  <!-- Hand Skeleton Vector Graphic (Left & Right Hands) -->
  <g transform="translate(930, 210)" filter="url(#glow)">
    <!-- Right Hand Skeleton -->
    <!-- Wrist -->
    <circle cx="50" cy="110" r="5" fill="#fcbf49"/>
    <!-- Palm base connections -->
    <path d="M50,110 L10,80 L25,45 L50,40 L75,45 L90,80 Z" fill="none" stroke="#0fa3b1" stroke-width="2.5" opacity="0.6"/>
    <!-- Thumb -->
    <path d="M50,110 L10,80 L-10,65 L-20,40 L-25,20" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="-25" cy="20" r="4.5" fill="#fcbf49"/>
    <!-- Index Finger -->
    <path d="M25,45 L15,0 L10,-40 L8,-75" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="8" cy="-75" r="4.5" fill="#fcbf49"/>
    <!-- Middle Finger -->
    <path d="M50,40 L50,-10 L50,-55 L50,-90" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="50" cy="-90" r="4.5" fill="#fcbf49"/>
    <!-- Ring Finger -->
    <path d="M75,45 L85,0 L90,-40 L92,-75" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="92" cy="-75" r="4.5" fill="#fcbf49"/>
    <!-- Pinky Finger -->
    <path d="M90,80 L115,50 L125,20 L130,-15" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="130" cy="-15" r="4.5" fill="#fcbf49"/>
    <!-- Joints -->
    <circle cx="10" cy="80" r="3.5" fill="#0fa3b1"/>
    <circle cx="25" cy="45" r="3.5" fill="#0fa3b1"/>
    <circle cx="50" cy="40" r="3.5" fill="#0fa3b1"/>
    <circle cx="75" cy="45" r="3.5" fill="#0fa3b1"/>
    <circle cx="90" cy="80" r="3.5" fill="#0fa3b1"/>
    <circle cx="15" cy="0" r="3.5" fill="#0fa3b1"/>
    <circle cx="10" cy="-40" r="3.5" fill="#0fa3b1"/>
    <circle cx="50" cy="-10" r="3.5" fill="#0fa3b1"/>
    <circle cx="50" cy="-55" r="3.5" fill="#0fa3b1"/>
    <circle cx="85" cy="0" r="3.5" fill="#0fa3b1"/>
    <circle cx="90" cy="-40" r="3.5" fill="#0fa3b1"/>
    <circle cx="115" cy="50" r="3.5" fill="#0fa3b1"/>
    <circle cx="125" cy="20" r="3.5" fill="#0fa3b1"/>
  </g>

  <g transform="translate(800, 240) scale(0.7)" filter="url(#glow)">
    <!-- Left Hand Skeleton -->
    <circle cx="-50" cy="110" r="5" fill="#fcbf49"/>
    <path d="M-50,110 L-10,80 L-25,45 L-50,40 L-75,45 L-90,80 Z" fill="none" stroke="#0fa3b1" stroke-width="2.5" opacity="0.6"/>
    <path d="M-50,110 L-10,80 L10,65 L20,40 L25,20" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="25" cy="20" r="4.5" fill="#fcbf49"/>
    <path d="M-25,45 L-15,0 L-10,-40 L-8,-75" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="-8" cy="-75" r="4.5" fill="#fcbf49"/>
    <path d="M-50,40 L-50,-10 L-50,-55 L-50,-90" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="-50" cy="-90" r="4.5" fill="#fcbf49"/>
    <path d="M-75,45 L-85,0 L-90,-40 L-92,-75" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="-92" cy="-75" r="4.5" fill="#fcbf49"/>
    <path d="M-90,80 L-115,50 L-125,20 L-130,-15" fill="none" stroke="#48cae4" stroke-width="2.5"/>
    <circle cx="-130" cy="-15" r="4.5" fill="#fcbf49"/>
  </g>

  <!-- Content Left Block -->
  <g transform="translate(70, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#0fa3b1" fill-opacity="0.15" stroke="#0fa3b1" stroke-width="1.2"/>
    <text x="14" y="18" fill="#48cae4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">
      GOVT OF INDIA • MoSJE / ISLRTC / DePWD INITIATIVE
    </text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      INDIAN SIGN LANGUAGE
    </text>
    <text x="0" y="125" fill="url(#tealGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">
      TO TEXT &amp; SPEECH TRANSLATION
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Real-Time Multilingual Communication Bridge for the Deaf &amp; Hard-of-Hearing Community
    </text>

    <!-- Pipeline Badges Flow -->
    <g transform="translate(0, 200)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="115" height="36" rx="8" fill="#1f2f54" stroke="#334155" stroke-width="1"/>
      <text x="57" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📷 Webcam</text>

      <path d="M122,18 L134,18" stroke="#0fa3b1" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 2 -->
      <rect x="140" y="0" width="135" height="36" rx="8" fill="#1f2f54" stroke="#334155" stroke-width="1"/>
      <text x="207" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🖐️ MediaPipe (258D)</text>

      <!-- Step 3 -->
      <rect x="290" y="0" width="125" height="36" rx="8" fill="#1f2f54" stroke="#334155" stroke-width="1"/>
      <text x="352" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">🧠 BiLSTM Model</text>

      <!-- Step 4 -->
      <rect x="430" y="0" width="115" height="36" rx="8" fill="#1f2f54" stroke="#334155" stroke-width="1"/>
      <text x="487" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📝 Gloss → NLP</text>

      <!-- Step 5 -->
      <rect x="560" y="0" width="130" height="36" rx="8" fill="url(#orangeGrad)"/>
      <text x="625" y="22" fill="#080e1a" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">🔊 Indic Speech</text>
    </g>

    <!-- Core Highlights -->
    <g transform="translate(0, 265)">
      <circle cx="6" cy="6" r="4" fill="#0fa3b1"/>
      <text x="18" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">100% On-Device Privacy: Zero Video Upload</text>

      <circle cx="310" cy="6" r="4" fill="#f77f00"/>
      <text x="322" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">&lt;500ms Real-Time Latency</text>

      <circle cx="530" cy="6" r="4" fill="#d62839"/>
      <text x="542" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">Fixed SOS Emergency Mode</text>
    </g>
  </g>
</svg>
